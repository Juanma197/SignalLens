name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run test suite
        run: python -m pytest tests

  windows-backup:
    name: Windows backup durability
    runs-on: windows-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run backup tests against Windows _commit
        run: python -m pytest -vv tests/test_database_backup.py

  windows-prototype:
    name: Windows prototype tests
    runs-on: windows-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run offline prototype tests in PowerShell 5.1
        shell: powershell
        run: |
          python -m pytest -q tests/test_prototype.py tests/test_prototype_store.py tests/test_prototype_financials.py
          if ($LASTEXITCODE -ne 0) { throw "Offline prototype tests failed" }

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up Python for offline UI workflow
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install backend dependencies for offline UI workflow
        run: |
          python -m venv ../.venv
          ../.venv/bin/python -m pip install -r ../backend/requirements.txt

      - name: Run frontend and offline UI workflow tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build production frontend
        run: npm run build

  containers:
    name: Build ${{ matrix.service }} container
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        service:
          - backend
          - frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build container
        run: docker build --tag signallens-${{ matrix.service }}:ci ${{ matrix.service }}
